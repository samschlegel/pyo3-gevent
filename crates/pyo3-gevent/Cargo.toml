[package]
name = "pyo3-gevent"
version = "0.1.0"
edition = "2024"

[[bench]]
name = "bench_pyo3_gevent"
harness = false

[dependencies]
pyo3 = "0.27.1"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
tracing = "0.1"

[dev-dependencies]
criterion = "0.7.0"

[profile.bench]
debug = true
